services:
  - type: web
    name: nursery-management-system
    env: node
    plan: free
    buildCommand: npm install && npm run build || echo 'no build step'
    startCommand: npm start || node server.js
    autoDeploy: true
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
