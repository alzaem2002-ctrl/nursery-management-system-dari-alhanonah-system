name: Netlify Direct Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🧱 Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: 🧩 Fix missing submodule URLs if needed
        run: |
          if [ ! -f .gitmodules ] || ! grep -q "webapp" .gitmodules; then
            echo "Fixing .gitmodules file..."
            cat <<EOF > .gitmodules
[submodule "webapp"]
    path = webapp
    url = https://github.com/alzaem2002-ctrl/webapp.git
EOF
          fi
          git submodule sync
          git submodule update --init --recursive

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🚀 Deploy to Netlify via CLI
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=dist --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN --prod
